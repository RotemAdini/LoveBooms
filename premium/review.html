<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0510">
<meta name="robots" content="noindex">
<title>מעבר על הקלפים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0510;--line:rgba(255,255,255,.13);--muted:rgba(255,255,255,.72);--dim:rgba(255,255,255,.5);--pink:#ff2f7d;--good:#2fd29a;--bad:#ff5a6e;--gold:#ffcf5c;--fd:"Rubik","Heebo",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(170deg,#14081d,#0b0510 55%,#06020a) fixed;color:#fff;font-family:"Heebo",system-ui,sans-serif;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 120px)}
button,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto}
header{padding:22px 0 8px;text-align:center}
h1{margin:0;font-family:var(--fd);font-weight:900;font-size:26px}
h1 span{color:var(--pink)}
header p{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px -14px 0;padding:10px 14px;background:rgba(11,5,16,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 1 auto;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:800;font-size:14px;white-space:nowrap;color:var(--muted)}
.tabs button.on{background:linear-gradient(135deg,#ff64a2,#e3004d);border-color:transparent;color:#fff}
.tabs button small{font-weight:700;opacity:.8}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.flt button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:800;font-size:14px;color:var(--muted)}
.flt button.on{background:#fff;color:#1a0a22;border-color:transparent}
.none{padding:30px 10px;text-align:center;color:var(--dim);font-weight:600}
.style{margin:14px 0 4px;padding:12px 14px;border-radius:16px;background:linear-gradient(160deg,rgba(255,79,150,.14),rgba(255,255,255,.03));border:1px solid rgba(255,90,160,.3)}
.style b{display:block;font-family:var(--fd);font-weight:800;font-size:16px}
.style p{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.55}
.lvl{margin:20px 2px 8px;font-family:var(--fd);font-weight:800;font-size:16px;color:var(--gold)}
.card{margin-bottom:10px;padding:12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:border-color .2s,background .2s,opacity .2s}
.card.keep{border-color:rgba(47,210,154,.6);background:rgba(47,210,154,.08)}
.card.drop{border-color:rgba(255,90,110,.6);background:rgba(255,90,110,.08)}
.card.drop .txt{text-decoration:line-through;text-decoration-color:rgba(255,90,110,.8);opacity:.6}
.card.edit{border-color:rgba(255,207,92,.7);background:rgba(255,207,92,.08)}
.txt{margin:0 0 10px;font-size:17px;font-weight:600;line-height:1.45}
.txt b{color:#ff8fbd;font-weight:700}
.txt i{font-style:normal;color:#8fd0ff;font-weight:700}
.meta{display:flex;align-items:center;gap:6px;margin-bottom:8px;color:var(--dim);font-size:12px;font-weight:700}
.meta .id{direction:ltr}
.meta .new{padding:1px 8px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.acts button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-weight:800;font-size:14px}
.card.keep .acts .k{background:var(--good);border-color:transparent;color:#03251a}
.card.drop .acts .d{background:var(--bad);border-color:transparent;color:#2a0308}
.card.edit .acts .e{background:var(--gold);border-color:transparent;color:#2a1a02}
.more{display:none;margin-top:8px}
.card.edit .more{display:block}
textarea{display:block;width:100%;min-height:74px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);font-size:16px;line-height:1.45;resize:vertical}
textarea:focus{outline:none;border-color:var(--gold)}
.lv{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:700;color:var(--muted)}
.lv button{min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:13px;font-weight:800}
.lv button.on{background:#fff;color:#1a0a22;border-color:transparent}
.bar{position:fixed;inset:auto 0 0;z-index:6;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(to top,rgba(11,5,16,.98) 70%,rgba(11,5,16,0))}
.bar-in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.stat{text-align:center;font-size:13px;font-weight:700;color:var(--muted)}
.stat b{color:#fff}
.send{min-height:54px;border:0;border-radius:18px;font-family:var(--fd);font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,#ff64a2,#ff1f6d 55%,#e3004d);box-shadow:0 10px 26px rgba(255,31,109,.38)}
.send:active{transform:scale(.98)}
.toast{position:fixed;left:50%;bottom:150px;z-index:9;transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:#1c0f28;border:1px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
#out{display:none;margin-top:8px;min-height:140px;direction:rtl;font-size:13px}
#out.show{display:block}
.free{margin:26px 0 0}
.free label{display:block;margin:0 2px 6px;font-weight:800;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>עוברים על <span>הקלפים</span></h1>
    <p>הסבב הקודם הוחל. ב"לבדיקה" מוצגים הקלפים החדשים, החפיסות שעוד לא עברת עליהן והטקסטים של מסכי המשחק. אפשר גם לסמן 👍 או 👎 ישר מתוך המשחק, והסימון יופיע כאן.</p>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div class="flt"><button type="button" id="fNew" class="on">🆕 לבדיקה</button><button type="button" id="fAll">כל הקלפים</button></div>
  <main id="list"></main>
  <div class="free">
    <label for="general">הערה כללית (לא חובה)</label>
    <textarea id="general" placeholder="למשל: פחות שאלות רגשיות, יותר משימות מצחיקות"></textarea>
  </div>
</div>
<div class="bar"><div class="bar-in">
  <div class="stat" id="stat"></div>
  <button class="send" id="send" type="button">להעתיק את הסיכום</button>
  <textarea id="out" readonly></textarea>
</div></div>
<div class="toast" id="toast"></div>
<script src="decks.js"></script>
<script>
const NAMES={kiss:"💋 אינטימיות",task:"🎯 משימה",question:"❔ שאלה",duel:"⚔️ דו־קרב",tempt:"❓ סיכון",drink:"🥂 שתייה",coupon:"🎟️ שוברים",bomb:"💣 הודעות פצצה",victory:"🏆 הודעות ניצחון",screen:"🖥️ מסכי הסבר"};
const STYLE={
  kiss:["מגע ונשיקות","קלף שמקרב פיזית: נשיקות, חיבוקים, עיסויים ולחישות. מי ששלף/ה עושה את זה לבן/בת הזוג. הרבה קלפים כאן עם טיימר, וברמות הגבוהות הם נעשים חושניים יותר."],
  task:["מה שעושים מול הצד השני","מי ששלף/ה מבצע/ת משהו: מצחיק (חיקוי, נאום, פוזה), מפלרטט (מבט, מחמאה) או מגע (עיסוי, ריקוד צמוד). זו החפיסה הכי גדולה, והיא קובעת את האווירה של הערב."],
  question:["שאלה שעונים עליה בקול","פותחת שיחה: זיכרונות משותפים, מה מושך, מה מדליק. ברמת חמים השאלות מתוקות, ובמתפוצץ הן על פנטזיות ועל מה יקרה אחרי המשחק."],
  duel:["שניכם במקביל, מי מנצח","קלף תחרותי ומהיר: מי שמסיים/ת ראשון/ה או מנצח/ת מקבל/ת צעד בונוס על הלוח. עובד הכי טוב כשהוא פיזי או קשור לזוג, ופחות כשהוא טריוויה כללית."],
  tempt:["הימור עם שעון","רשות: מחליטים לפני שרואים את הקלף. יש זמן קצוב; הצלחה מקדמת צעד, כישלון מחזיר צעד. הקלף צריך להיות קשה בדיוק במידה כדי שיהיה מתח."],
  drink:["לגימה","מופיע רק במצב שתייה קליל או פרוע. הוראות קצרות, בלי לחץ. מים ושתייה קלה תמיד בסדר."],
  coupon:["פרס למנצח/ת","מי שמנצח/ת בוחר/ת שובר אחד מתוך שלושה. השובר נשמר במגירה עד שמממשים אותו. אמור להיות משהו שבאמת רוצים לקבל."],
  bomb:["ההודעה כשדורכים על פצצה","מופיעה באקראי אחרי הפיצוץ, כשהכלי חוזר להתחלה. אמורה לעקוץ קצת ולהצחיק."],
  victory:["השורה במסך הניצחון","מופיעה מתחת לשם של מי שניצח/ה. אמורה להרגיש כמו חגיגה."],
  screen:["מסכי ההסבר במשחק","הטקסטים שמסבירים מה קורה: לפני דו־קרב, לפני סיכון, לפני משימה עם זמן ועוד. כאן מסמנים מה מבלבל, ארוך מדי או לא בטון הנכון."]
};
const REVIEW_ALL=new Set(["duel","tempt","drink","coupon","bomb","victory","screen"]);
const LVL={1:"🌶️ חמים",2:"🔥 לוהט",3:"💥 מתפוצץ"};
const VERBS={give:"תני",do:"עשי",say:"אמרי",ask:"שאלי",whisper:"לחשי",choose:"בחרי",look:"הסתכלי",describe:"תארי",tell:"ספרי",try:"נסי",hold:"החזיקי",invent:"המציאי",make:"גרמי",take:"קחי",return:"חזרי",drink:"שתי",stand:"עמדי",show:"הראי",perform:"בצעי",start:"תלחצי",answer:"עני",count:"מני",touch:"געי",keep:"שמרי"};
const KEY="pxCardReview";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(_e){}
const FRESH=new Set(["{actor}, {give} ל{target} נשיקה ארוכה על הלחי, קרוב לשפתיים","{actor}, {hold} את הפנים של {target} בשתי ידיים ו{give} נשיקה אחת","{actor}, {give} ל{target} חיבוק מאחור של 20 שניות","{actor}, {give} ל{target} נשיקה אחת בעיניים עצומות, בלי למהר","{actor}, {give} ל{target} נשיקה צרפתית של 15 שניות","{actor}, {give} ל{target} נשיקה מאחורי האוזן","{actor}, {give} ל{target} נשיקות מהכתף ועד האוזן","{actor}, {give} ל{target} עיסוי גב תחתון של דקה","{actor}, {give} ל{target} נשיקה על הבטן","{actor}, {give} ל{target} עיסוי ירכיים של דקה","{actor}, {do} ל{target} עיסוי ראש של 20 שניות","{actor}, {choose} שיר ו{do} ריקוד צמוד עם {target} במשך 30 שניות","{actor}, {describe} את {target} כאילו זו מודעת היכרויות","{actor}, {give} ל{target} עיסוי כפות רגליים של 30 שניות","{actor}, {do} ל{target} סרנדה: שורה אחת משיר אהבה, בכל הכוח","{actor}, {tell} ל{target} מה הדבר הראשון שהיית עושה אם הייתם לבד על אי בודד","{actor}, {give} ל{target} עיסוי צוואר של דקה","{actor}, {do} ל{target} ליטוף בגב, מתחת לחולצה, במשך 20 שניות","{actor}, {take} את היד של {target} ו{show} איפה הכי נעים לך","{actor}, מה הזיכרון הראשון שלך מ{target}?","{actor}, למה הכי התגעגעת אצל {target} בפעם האחרונה שלא התראיתם?","{actor}, איפה בגוף הכי נעים לך לקבל נשיקה?","{actor}, מה הלילה הכי טוב שהיה לכם ביחד?","{actor}, מאיזה חלק בגוף של {target} הכי קשה לך להתעלם?","{actor} ו{target}, כותבים בתורות מילה באצבע על הגב. מי שמנחש קודם מנצח","{actor} ו{target}, מי אומר קודם 5 דברים שהצד השני אוהב?","{actor} ו{target}, מי נזכר קודם מה לבשתם בדייט הראשון?","{actor} ו{target}, נשיקת בזק: סופרים עד 3, ומי שמנשק קודם את הלחי של הצד השני מנצח","{actor} ו{target}, חיקוי הדדי: מי מחקה טוב יותר את הצד השני? מי שצוחק קודם מפסיד","{actor} ו{target}, מי אומר קודם 3 מקומות שהייתם בהם ביחד השנה?","{actor} ו{target}, הורדת ידיים: הטוב משלושה","{actor} ו{target}, מי מצליח קודם לגנוב נשיקה? מותר להתחמק","{actor} ו{target}, מי אומר קודם את התאריך המדויק שבו הכרתם?","{actor}, יש לך 15 שניות לומר 5 מאכלים אהובים על {target}","{actor}, יש לך 20 שניות לומר 5 מקומות שטיילתם בהם ביחד","{actor}, יש לך 15 שניות לומר 4 דברים שמרגיזים את {target}, עם חיוך","{actor}, יש לך 20 שניות לשיר שורה משיר שמזכיר לך את {target}","{actor}, יש לך 10 שניות לומר 3 סיבות למה כדאי להתאהב בך"]);
if(st._v!==3){st={_v:3,_general:""};try{localStorage.setItem(KEY,JSON.stringify(st))}catch(_e){}}
let onlyNew=true;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(_e){}};
const DECKS=Object.assign({},LB_DECK,{coupon:LB_COUPONS.map(c=>[0,c[0]+" "+c[1]]),bomb:LB_SCREENS.bomb.map(t=>[0,t]),victory:LB_SCREENS.victory.map(t=>[0,t]),screen:LB_SCREENS.screens.map(t=>[0,t])});
const toCheck=(cat,t)=>REVIEW_ALL.has(cat)||FRESH.has(t);
const CATS=Object.keys(DECKS);
let cur=CATS[0];
function plain(t){let x=t.replaceAll("{start}","תלחצי").replaceAll("{bo}","בו").replaceAll("{actor}","נועה").replaceAll("{target}","דניאל");for(const k in VERBS)x=x.replaceAll("{"+k+"}",VERBS[k]);return x}
function pretty(t){let x=esc(t).replaceAll("{start}","תלחצי").replaceAll("{bo}","בו").replaceAll("{actor}","<b>נועה</b>").replaceAll("{target}","<i>דניאל</i>");for(const k in VERBS)x=x.replaceAll("{"+k+"}",VERBS[k]);return x}
const idOf=(cat,i)=>cat+"-"+(i+1);
function counts(cat){const a=DECKS[cat];let k=0,d=0,e=0;a.forEach((_,i)=>{const s=(st[idOf(cat,i)]||{}).s;if(s==="keep")k++;else if(s==="drop")d++;else if(s==="edit")e++});return{k,d,e,n:a.length}}
function renderTabs(){$("tabs").innerHTML=CATS.map(c=>{const x=counts(c);const nf=DECKS[c].filter(q=>toCheck(c,q[1])).length;if(onlyNew&&!nf)return "";return `<button type="button" data-cat="${c}" class="${c===cur?"on":""}">${NAMES[c]} <small>${onlyNew?nf:x.n}</small></button>`}).join("")}
function renderList(){
  const a=DECKS[cur];let html=`<section class="style"><b>${NAMES[cur]} · ${STYLE[cur][0]}</b><p>${STYLE[cur][1]}</p></section>`,lastLv=null;
  a.forEach((c,i)=>{
    if(onlyNew&&!toCheck(cur,c[1]))return;
    if(c[0]!==lastLv&&c[0]){lastLv=c[0];html+=`<div class="lvl">${LVL[c[0]]}</div>`}
    const id=idOf(cur,i),s=st[id]||{},lv=s.lv||c[0];
    html+=`<article class="card ${s.s||""}" data-id="${id}">
      <div class="meta"><span class="id">${id}</span>${FRESH.has(c[1])?'<span class="new">חדש</span>':""}</div>
      <p class="txt">${pretty(c[1])}</p>
      <div class="acts"><button type="button" class="k" data-s="keep">👍 נשאר</button><button type="button" class="d" data-s="drop">👎 יורד</button><button type="button" class="e" data-s="edit">✏️ לשנות</button></div>
      <div class="more"><textarea placeholder="איך היית כותבת אותו, או מה מפריע בו">${esc(s.note||"")}</textarea>
      ${c[0]?`<div class="lv">רמה: ${[1,2,3].map(n=>`<button type="button" data-lv="${n}" class="${n===lv?"on":""}">${LVL[n].split(" ")[0]}</button>`).join("")}</div>`:""}</div>
    </article>`;
  });
  $("list").innerHTML=html;
}
function renderStat(){let k=0,d=0,e=0,n=0;CATS.forEach(c=>{const x=counts(c);k+=x.k;d+=x.d;e+=x.e;n+=x.n});$("stat").innerHTML=`עברת על <b>${k+d+e}</b> מתוך <b>${n}</b> · 👍 ${k} · 👎 ${d} · ✏️ ${e}`}
function summary(){
  const lines=["סיכום מעבר על הקלפים — פצצות אהבה",""];
  const drop=[],edit=[],keep=[];let untouched=0;
  CATS.forEach(cat=>DECKS[cat].forEach((c,i)=>{
    const id=idOf(cat,i),s=st[id]||{},t=plain(c[1]);
    if(s.s==="drop")drop.push(`[${id}] ${t}`);
    else if(s.s==="edit")edit.push(`[${id}] ${t}\n   ← ${s.note?s.note.trim():"(בלי הערה)"}${s.lv&&s.lv!==c[0]?`\n   רמה: ${c[0]} ← ${s.lv}`:""}`);
    else if(s.s==="keep")keep.push(id);
    else untouched++;
  }));
  lines.push(`להוריד (${drop.length}):`,...(drop.length?drop:["—"]),"",`לשנות (${edit.length}):`,...(edit.length?edit:["—"]),"",`נשארים (${keep.length}): ${keep.join(", ")||"—"}`,`לא סומנו: ${untouched}`);
  const g=$("general").value.trim();if(g)lines.push("","הערה כללית:",g);
  return lines.join("\n");
}
function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-cat]");if(!b)return;cur=b.dataset.cat;renderTabs();renderList();window.scrollTo({top:0})});
$("list").addEventListener("click",e=>{
  const card=e.target.closest(".card");if(!card)return;const id=card.dataset.id,s=st[id]||(st[id]={});
  const a=e.target.closest("button[data-s]"),l=e.target.closest("button[data-lv]");
  if(a){s.s=s.s===a.dataset.s?"":a.dataset.s;card.className="card "+(s.s||"");if(s.s==="edit")card.querySelector("textarea").focus()}
  else if(l){s.lv=+l.dataset.lv;card.querySelectorAll("button[data-lv]").forEach(b=>b.classList.toggle("on",b===l))}
  else return;
  save();renderTabs();renderStat();
});
$("list").addEventListener("input",e=>{if(e.target.tagName!=="TEXTAREA")return;const card=e.target.closest(".card"),s=st[card.dataset.id]||(st[card.dataset.id]={});s.note=e.target.value;save()});
$("general").value=st._general||"";
$("general").addEventListener("input",e=>{st._general=e.target.value;save()});
$("send").addEventListener("click",async()=>{
  const text=summary(),out=$("out");out.value=text;
  try{await navigator.clipboard.writeText(text);toast("הסיכום הועתק. הדביקי אותו בצ'אט")}
  catch(_e){out.classList.add("show");out.focus();out.select();toast("סמני את הטקסט והעתיקי")}
});
$("fNew").onclick=()=>{onlyNew=true;if(!DECKS[cur].some(q=>toCheck(cur,q[1])))cur=CATS.find(c=>DECKS[c].some(q=>toCheck(c,q[1])))||cur;$("fNew").classList.add("on");$("fAll").classList.remove("on");renderTabs();renderList()};
$("fAll").onclick=()=>{onlyNew=false;$("fAll").classList.add("on");$("fNew").classList.remove("on");renderTabs();renderList()};
if(onlyNew)if(!DECKS[cur].some(q=>toCheck(cur,q[1])))cur=CATS.find(c=>DECKS[c].some(q=>toCheck(c,q[1])))||cur;
renderTabs();renderList();renderStat();
</script>
</body>
</html>
